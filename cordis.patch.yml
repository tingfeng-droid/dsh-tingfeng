# Bundle layer: DSH loads this file automatically when dsh-tingfeng is enabled.
# Do NOT copy its insert block into the profile's cordis.patch.yml: doing so
# duplicates entry IDs and prevents Settings from saving (issue #470).
# Keep profile overrides as top-level - id: mnemon rows. See the installation
# guide's "Settings cannot save after manual installation" recovery steps.
- insert:
    # Keep the v0.4 `mnemon` Entry as the public configuration target while
    # making every v0.5 component inherit its enabled state. The expression
    # reads the core row's own flag (rather than its effective state) to avoid
    # recursing through this ancestor gate. The group itself prepares the
    # Starter's dependency resolution before it imports its children.
    - id: mnemon-bundle
      name: 'dsh-tingfeng/bundle'
      group: true
      disabled: !!js >-
        ((entry) => entry.options.disabled?.__jsExpr
          ? Boolean(entry.evaluate(entry.options.disabled.__jsExpr))
          : Boolean(entry.options.disabled))
        ([...loader.entries()].find(entry => entry.options.id === 'mnemon'))
      config:
        - id: mnemon
          # Core/Host and default settings. Sources own their independent Entries.
          name: 'dsh-tingfeng'
          config:
            routingGuidance: true
            lifecycleEnabled: true
            recallMode: guided
            writebackMode: guided
            idleReviewMs: 30000
            tabEnabled: true
            writeEnabled: true
            remoteAccess: read-only
            timeoutMs: 10000
            defaultRecallLimit: 10
            embedding:
              enabled: false
              endpoint: http://localhost:11434
              model: nomic-embed-text
            recallQuality:
              policy: strict-v1
              lowScoreThreshold: 0.25
              highScoreThreshold: 0.6
              candidateMultiplier: 3
              maxMediumResults: 4
              maxRankedResults: 4
              maxUnknownResults: 2
        - id: mnemon-source-runtime
          name: dsh-tingfeng-source-runtime
        - id: mnemon-source-documents
          name: dsh-tingfeng-source-documents
        - id: mnemon-source-memory-spaces
          name: dsh-tingfeng-source-memory-spaces
          config:
            # One Provider ships in the box: the local Mnemon store, which is
            # the only one that holds memory on its own disk. The external ones
            # (Mem0, Honcho, OpenViking, Byterover, Hindsight, Holographic,
            # RetainDB, Supermemory) install separately and are named here by a
            # composition that wants them.
            providers:
              - use: dsh-tingfeng-provider-mnemon-native
                instanceId: mnemon-native
        - id: mnemon-strategy-default-three-tier
          name: dsh-tingfeng-strategy-default-three-tier
        # A second main Strategy; memoryView.strategyTypeId selects which one
        # composes the View. It stays off until selected.
        - id: mnemon-strategy-general
          name: dsh-tingfeng-strategy-general
          disabled: true
        # v0.5 ships these narrowly scoped enhancements with the Starter so the
        # Settings switches are always available. They remain opt-in.
        - id: mnemon-strategy-auto-capture
          name: dsh-tingfeng-strategy-auto-capture
          disabled: true
        - id: mnemon-strategy-light-context
          name: dsh-tingfeng-strategy-light-context
          disabled: true
        - id: mnemon-strategy-scoped
          name: dsh-tingfeng-strategy-scoped
          disabled: true
