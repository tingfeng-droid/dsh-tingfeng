packages:
  - .
  - plugins/*

# Author packages use normal semver peers; the workspace links those peers only
# for local development. Packed/extracted packages have no workspace dependency.
linkWorkspacePackages: true
preferWorkspacePackages: true
# [2026-11-05 办公机本地] 18 个子包之间有 4 组循环依赖（provider↔source↔strategy），
# pnpm 默认拒绝按拓扑序构建。这些环是上游 monorepo 结构本身，不是错误，
# 放开让它们任意顺序构建即可。仅本机构建时需要，不影响产物。
ignoreWorkspaceCycles: true

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  lightningcss: true
  node-pty: true
  protobufjs: true

